    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ianatkinson.squishsort
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Spare icons for App Store product page tests (Strawbie stays the default).
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: Bubblegum
        CODE_SIGN_STYLE: Automatic
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) $(TESTER_FLAG)
    scheme:
      storeKitConfiguration: App/SquishSort.storekit
      testTargets:
        - SquishSortUITests
  SquishSortUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/UITests
    dependencies:
      - target: SquishSort
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ianatkinson.squishsort.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
