# XcodeGen spec. CI runs `xcodegen generate` to make SquishSort.xcodeproj;
# the generated project isn't committed.
name: SquishSort
options:
  bundleIdPrefix: com.ianatkinson
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: WVLPAK48UN
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  SquishKit:
    path: Packages/SquishKit
targets:
  SquishSort:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: Levels
        type: folder
        buildPhase: resources
      - path: Content
        type: folder
        buildPhase: resources
    dependencies:
      - package: SquishKit
        product: SquishCore
      - package: SquishKit
        product: SquishLevels
      - package: SquishKit
        product: SquishPolicy
      - sdk: StoreKit.framework
    entitlements:
      path: App/SquishSort.entitlements
      properties:
        com.apple.developer.declared-age-range: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Squish Sort
        CFBundleLocalizations: [en, ja, ko, zh-Hant]
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: Marshmallow
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ianatkinson.squishsort
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: Bubblegum
        CODE_SIGN_STYLE: Automatic
    scheme:
      storeKitConfiguration: App/SquishSort.storekit
