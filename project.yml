# XcodeGen spec. CI runs `xcodegen generate` to make SquishSort.xcodeproj;
# the generated project isn't committed.
name: SquishSort
options:
  bundleIdPrefix: com.ianatkinson
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: WVLPAK48UN
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    # Google's public test ids. The TestFlight workflow passes the real ones from repo secrets
    # (ADMOB_APP_ID, ADMOB_INTERSTITIAL, ADMOB_REWARDED) once the AdMob account is verified.
    ADMOB_APP_ID: ca-app-pub-3940256099942544~1458002511
    ADMOB_INTERSTITIAL: ca-app-pub-3940256099942544/4411468910
    ADMOB_REWARDED: ca-app-pub-3940256099942544/1712485313
    # Set to TESTER by the TestFlight workflow for builds that keep the tester tools.
    TESTER_FLAG: ""
packages:
  SquishKit:
    path: Packages/SquishKit
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 12.0.0
  GoogleUMP:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    from: 3.0.0
targets:
  SquishSort:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: Levels
        type: folder
        buildPhase: resources
      - path: Content
        type: folder
        buildPhase: resources
    dependencies:
      - package: SquishKit
        product: SquishCore
      - package: SquishKit
        product: SquishLevels
      - package: SquishKit
        product: SquishPolicy
      - package: SquishKit
        product: SquishSoft
      - package: SquishKit
        product: SquishWorkshop
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUMP
        product: GoogleUserMessagingPlatform
      - sdk: StoreKit.framework
    entitlements:
      path: App/SquishSort.entitlements
      properties:
        com.apple.developer.declared-age-range: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Squish Sort
        # Taken from the build settings, so the TestFlight workflow's build number reaches the app.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleLocalizations: [en, ja, ko, zh-Hant]
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: Marshmallow
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        # Google's public test app id until the AdMob account is verified (see ADMOB_APP_ID above).
        AdMobInterstitialUnit: $(ADMOB_INTERSTITIAL)
        AdMobRewardedUnit: $(ADMOB_REWARDED)
        NSPhotoLibraryAddUsageDescription: Squish Sort saves a clip to your photos only when you choose Save Video after tapping Share.
        NSUserTrackingUsageDescription: Squish Sort uses this to show ads that suit you better. You can still play everything if you say no.
        GADApplicationIdentifier: $(ADMOB_APP_ID)
        GADDelayAppMeasurementInit: true
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
          - SKAdNetworkIdentifier: p78axxw29g.skadnetwork
          - SKAdNetworkIdentifier: v72qych5uu.skadnetwork
          - SKAdNetworkIdentifier: ludvb6z3bs.skadnetwork
          - SKAdNetworkIdentifier: cp8zw746q7.skadnetwork
          - SKAdNetworkIdentifier: 3sh42y64q3.skadnetwork
          - SKAdNetworkIdentifier: c6k4g5qg8m.skadnetwork
          - SKAdNetworkIdentifier: s39g8k73mm.skadnetwork
          - SKAdNetworkIdentifier: 3qy4746246.skadnetwork
          - SKAdNetworkIdentifier: hs6bdukanm.skadnetwork
          - SKAdNetworkIdentifier: mlmmfzh3r3.skadnetwork
          - SKAdNetworkIdentifier: v4nxqhlyqp.skadnetwork
          - SKAdNetworkIdentifier: wzmmz9fp6w.skadnetwork
          - SKAdNetworkIdentifier: su67r6k2v3.skadnetwork
          - SKAdNetworkIdentifier: yclnxrl5pm.skadnetwork
          - SKAdNetworkIdentifier: 7ug5zh24hu.skadnetwork
          - SKAdNetworkIdentifier: gta9lk7p23.skadnetwork
