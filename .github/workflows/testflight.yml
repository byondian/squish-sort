name: TestFlight

# Manual only: archives a signed build and uploads it to App Store Connect
# (TestFlight). Uses cloud signing with the "Squish Sort CI" API key.
# Repo secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the .p8 file contents).
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What to test"
        required: false
        default: ""
      tester_tools:
        description: "Keep the tester tools. NOT FOR REVIEW when on: turn off for the build that goes to App Review"
        type: boolean
        required: false
        default: true
      creator:
        description: "Creator build for partners who film the game: no tester tools and no ads at all. NOT FOR REVIEW"
        type: boolean
        required: false
        default: false

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Gates 1 and 2 must pass first
        run: |
          swift test --package-path Packages/SquishKit
          swift run -c release --package-path Packages/SquishKit squish-levels check Levels
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Write the API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_INTERSTITIAL: ${{ secrets.ADMOB_INTERSTITIAL }}
          ADMOB_REWARDED: ${{ secrets.ADMOB_REWARDED }}
          TESTER_TOOLS: ${{ inputs.tester_tools }}
          CREATOR: ${{ inputs.creator }}
        run: |
          set -o pipefail
          # Real ad ids when all three are set as repo secrets; Google's test ids otherwise.
          EXTRA=()
          if [ -n "$ADMOB_APP_ID" ] && [ -n "$ADMOB_INTERSTITIAL" ] && [ -n "$ADMOB_REWARDED" ]; then
            EXTRA+=("ADMOB_APP_ID=$ADMOB_APP_ID" "ADMOB_INTERSTITIAL=$ADMOB_INTERSTITIAL" "ADMOB_REWARDED=$ADMOB_REWARDED")
            echo "Ads: real ids"
          elif [ "$CREATOR" = "true" ]; then
            echo "Ads: none (creator build)"
          elif [ "$TESTER_TOOLS" = "false" ]; then
            echo "::error::This is the build for App Review, but the ADMOB_APP_ID, ADMOB_INTERSTITIAL and ADMOB_REWARDED secrets are not all set. It would ship test ads. Stopping."
            exit 1
          else
            echo "Ads: Google's test ids (ADMOB_* secrets are not set)"
          fi
          if [ "$CREATOR" = "true" ]; then EXTRA+=("TESTER_FLAG=CREATOR"); echo "Creator build: tester tools out, ads off"
          elif [ "$TESTER_TOOLS" != "false" ]; then EXTRA+=("TESTER_FLAG=TESTER"); echo "Tester tools: in"; else echo "Tester tools: out"; fi
          xcodebuild archive -project SquishSort.xcodeproj -scheme SquishSort \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SquishSort.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} "${EXTRA[@]}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -40
      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>WVLPAK48UN</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/SquishSort.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
